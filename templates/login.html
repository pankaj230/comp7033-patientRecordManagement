<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Record System - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="header">
        <h1>Secure Patient Record Management System</h1>
        <p>🏥 Modern, secure, and efficient healthcare record management</p>
    </div>
    <div class="login-container">
        <h2>Login to Your Account</h2>
        <div id="alertContainer"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div class="error-message"></div>
            </div>
            <button type="submit" id="submitButton">Login</button>
        </form>
        <div class="register-link">
            <p>Don't have an account? <a href="/register" id="registerLink">Register here</a></p>
        </div>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/pages/login.js') }}"></script>
</body>
</html>
